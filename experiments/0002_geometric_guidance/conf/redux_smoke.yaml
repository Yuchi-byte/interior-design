# Plumbing, not a claim: the whole Redux-scale sweep flow on the weightless
# `ToyFlowMapBackend` and the geometry doubles, CPU-only, offline, in seconds.
# The fake backend has no prompt cache, so the Redux encode and the
# combined-embedding registration are skipped — those are pinned by the
# adapter's own unit tests — and what this exercises is the arm structure, the
# removal-compliance reading, the common-mask scoring, the deferred judges,
# and the artifact writing.
#
#   uv run --no-sync python experiments/0002_geometric_guidance/run.py --config redux_smoke
study: fmrg_redux
name: 0002_fmrg_redux_smoke

seeds: [0]

resolution: 128

redux_scales: [0.0, 0.3, 1.0]

backends:
  kind: fake
  device: cpu
  # bfloat16 on purpose: the toy backend speaks it at its boundary, which is
  # exactly the trap the adapter's float32 state rule exists for.
  dtype: bfloat16
  depth_dtype: float32
  segmentation_dtype: float32

strip:
  # Stage zero on the fake inpainting stack, small enough to stay in seconds.
  prompt: empty room, bare floor, bare wall, no furniture, plain interior
  negative_prompt: furniture, radiator, vacuum cleaner, clutter
  dilation_radius: 2
  passes: 2
  steps: 4
  fill_strength: 0.6
  guidance_scale: 7.5
  dtype: float32

sampler:
  grid_steps: 24
  early_stop: 6
  unguided_steps: 1
  start_sigma: 0.9
  text_guidance_scale: 3.5
  stepping: endpoint_reuse
  differentiate_through_velocity: false

guidance:
  eta: 5.0
  iterations: 1
  erosion_radius: 2
  resegment: true

adherence:
  # Checkpoint-free, so the smoke run never touches the network.
  kind: contents_change

# No checkpoint offline; the per-arm reading is recorded as null.
image_similarity_checkpoint: null

preference:
  # Checkpoint-free stand-in; it reads spread, not beauty.
  kind: contrast

scenes:
  - photo: scandi_living_room
    style_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    renovation_prompt: renovate this room into a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight, keep the room structure, layout, viewpoint and camera angle, remove the chair in the room
    eval_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    removal_object: chair
    removal_classes: [19, 30, 75]
    removal_substituted: true
