# The claim under test, until now only a code comment above `AlignmentMode`:
# that a metric depth backend (DA3) guides better under a shift-only fit than
# under no fit at all. Three arms per (scene, seed) from one seed and prompt —
# unguided control, guided at raw residuals (`none`), guided at `shift` — and
# every render scored under all three DA3 modes plus the affine-invariant DA2
# judge, so no arm is graded by its own objective alone. Needs a GPU, the four
# prefetched checkpoints, and the out-of-band `depth_anything_3` install the
# DA3 backend documents.
study: da3_alignment
name: 0002_da3_alignment

# Listed, not drawn, so any number reported here can be reproduced exactly.
seeds: [0, 1, 2, 3]

# 512 is SD1.5's training resolution and a multiple of 64; photos are
# centre-cropped square first, so no room is anamorphically squashed.
resolution: 512

backends:
  kind: real
  device: cuda
  deterministic: true
  # float32 throughout, for comparability with the 0002 reference numbers.
  dtype: float32
  depth_dtype: float32
  segmentation_dtype: float32
  scheduler: ddim

sampler:
  steps: 30
  # High noise, per the recorded regime decision: at 0.6 the unguided control
  # already sits at the metric's noise floor and nothing measured there
  # separates two methods.
  noise_strength: 0.9
  text_guidance_scale: 7.5

guidance:
  # The clipped raw step. The strength multiplies a raw gradient in the
  # backend's own squared-disparity units, so a DA2 strength does not carry
  # over: DA3's disparity spans are smaller and its gradients with them.
  # Swept on the pilot scene at seed 0 (strength / raw-arm Δ on its own metric
  # / shift-arm Δ / adherence vs control 0.3240): 10 → −37%/−37%/level,
  # 30 → −61%/−55%/level, 100 → −71%/−84%/level, 300 → −83%/−86%/level with
  # both renders still clean rooms. 300 is where the two arms clearly
  # separate while adherence holds, so the grid is measured there.
  strength: 300.0
  clip: 0.02
  erosion_radius: 2
  resegment: true
  # One guided arm per mode, beside the shared control.
  arms: [none, shift]

adherence:
  kind: clip
  checkpoint: openai/clip-vit-base-patch32

# One scene per room type of the 0002 grid, at the benchmark's own prompts.
scenes:
  - photo: hotel_suite_living_room
    prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: scandi_living_room
    prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: bedroom_warm_ensuite
    prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
  - photo: blue_white_kitchen
    prompt: a modern industrial kitchen, matte black cabinetry, steel shelving, concrete worktops
