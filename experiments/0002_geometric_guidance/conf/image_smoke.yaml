# Plumbing, not a claim: the whole image-reward study flow on the weightless
# `ToyFlowMapBackend`, the geometry doubles and the checkpoint-free image
# energies (fixed random projections and a two-stage pixel pyramid), CPU-only,
# offline, in seconds. What this exercises is the arm structure, the per-scene
# weight sizing, the CPU parking of the helper bank, the common-mask scoring,
# the three-phase deferred eval and the artifact writing.
#
#   uv run --no-sync python experiments/0002_geometric_guidance/run.py --config image_smoke
study: fmrg_image
name: 0002_fmrg_image_smoke

seeds: [0]

resolution: 128

backends:
  kind: fake
  device: cpu
  # bfloat16 on purpose: the toy backend speaks it at its boundary, which is
  # exactly the trap the adapter's float32 state rule exists for.
  dtype: bfloat16
  depth_dtype: float32
  segmentation_dtype: float32

sampler:
  grid_steps: 24
  early_stop: 6
  unguided_steps: 1
  start_sigma: 0.9
  text_guidance_scale: 3.5
  stepping: endpoint_reuse
  differentiate_through_velocity: false

guidance:
  eta: 5.0
  iterations: 1
  erosion_radius: 2
  resegment: true

image:
  models: [clip, dinov2, siglip, vgg]
  composite_models: [clip, dinov2, siglip, vgg]
  depth_weight: null
  sizing_fraction: 0.5

adherence:
  # Checkpoint-free, so the smoke run never touches the network.
  kind: contents_change

# No checkpoint-free stand-in exists for the image-similarity judge; the smoke
# run skips the metric.
image_similarity_checkpoint: null

preference:
  # Checkpoint-free pixel spread: exercises the plumbing, reads no beauty.
  kind: contrast

scenes:
  - photo: scandi_living_room
    style_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    eval_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    # The fake segmenter's one piece of furniture, so the removal-compliance
    # reading is nonzero offline; its window block feeds the windows-kept one.
    removal_object: sofa
    removal_classes: [23]
    removal_substituted: true
