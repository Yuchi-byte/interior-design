# The claim: geometric guidance keeps the room while restyling it.
#
# Eight real photographs, three renovation prompts, two seeds, guided against an
# unguided control at the identical seed. Needs a GPU and the four checkpoints
# `roomgen-prefetch` seeds.
name: 0002_geometric_guidance

# Listed, not drawn, so any number reported here can be reproduced exactly.
# The current reference numbers were measured over exactly these four.
seeds: [0, 1, 2, 3]

# 512 is SD1.5's training resolution and a multiple of 64; photos are
# centre-cropped square first, so no room is anamorphically squashed.
resolution: 512

backends:
  kind: real
  device: cuda
  # The reference numbers were measured with this on; the one op it cannot pin
  # is the memory-efficient attention backward (warn-only).
  deterministic: true
  # float32 for comparability of the recorded numbers across runs, not out of
  # necessity: the reward's reduction and the guided step's RMS sizing are
  # float32 by contract whatever dtype the maps arrive in, so a float16 sampler
  # keeps a finite, correctly-directed gradient (cosine 0.99998 against float32
  # at 512x512). Set dtype=float16 if VRAM forces it.
  dtype: float32
  depth_dtype: float32
  segmentation_dtype: float32
  scheduler: ddim

sampler:
  steps: 30
  # SDEdit strength. This file is the frozen v1 claim config: every number in
  # `report.md` was measured at 0.6, so it stays pinned here. New comparisons
  # run at 0.9 or from pure noise — at 0.6 the unguided control already sits at
  # the metric's noise floor, so nothing measured there separates two methods
  # (`docs/research/geometric-guidance.md`).
  noise_strength: 0.6
  text_guidance_scale: 7.5

guidance:
  # Clipped raw step, the arm that dominates every other measured (report.md):
  # the raw step's energy-adaptivity handles scenes whose geometry is already
  # close, the cap prevents the high-noise adversarial runaway. Over seeds 0-3
  # it removes ~74% of the control's depth error at noise 0.6 and ~54% at 0.9,
  # both at unchanged adherence. Uncapped raw (clip: null) collapses at
  # noise >= 0.8.
  strength: 10.0
  clip: 0.02
  erosion_radius: 2
  # Both sides of the run read a prediction's segmentation this way: the
  # guidance while sampling, and the eval that judges the render afterwards.
  # `subtract_contents` exempts only what the segmenter affirmatively calls
  # contents, so it keeps every id the ADE20K partition does not name; it ties
  # intersect_shell at noise 0.6 and beats it at 0.9 while scoring more of
  # the room (report.md).
  mask_mode: subtract_contents

adherence:
  # The prompt-adherence metric, on the fourth checkpoint `roomgen-prefetch` seeds
  # (~600MB in ROOMGEN_HF_HOME).
  kind: clip
  checkpoint: openai/clip-vit-base-patch32

# Three prompts over eight photos, grouped by room type so the renovation asked
# for is plausible for the shell it has to keep.
scenes:
  - photo: hotel_suite_living_room
    prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: scandi_living_room
    prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: lakehouse_living_room
    prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: bedroom_warm_ensuite
    prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
  - photo: bedroom_twin_blue
    prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
  - photo: ny_loft_bedroom
    prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
  - photo: hostel_kitchen
    prompt: a modern industrial kitchen, matte black cabinetry, steel shelving, concrete worktops
  - photo: blue_white_kitchen
    prompt: a modern industrial kitchen, matte black cabinetry, steel shelving, concrete worktops
