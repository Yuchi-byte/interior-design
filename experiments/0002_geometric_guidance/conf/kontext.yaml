# The Kontext study: FLUX.1-Kontext-dev — a strong instruction-editing prior
# that holds the reference photo as attention context — with and without the
# depth reward, at one seed on five scenes. The unguided arm answers "does the
# strong prior alone already hold the geometry?"; the guided arms answer "what
# does depth steering add on top, and at which operating point?"; the filmed
# arms' endpoint strips answer "is the one-step endpoint estimate a usable
# steering signal here at all", each frame carrying its RGB decode, its EoMT
# segmentation, its masked depth map and its own depth error, so the strips
# read as convergence curves too. Every guided walk also records a per-step
# trace (energy, gradient RMS, applied displacement RMS) — the diagnosis data.
#
# The depth reference is the STRIPPED EMPTY ROOM's shell (stage zero runs
# 0003's strip on every photo first, the strip stack released before Kontext
# loads), by owner decision: the empty shell is nearly the whole frame, a far
# larger valid comparison area than the furnished shell. The furnished photo's
# shell rides along as the secondary depth column (`depth_error_photo`) so the
# reference switch itself is quantified. The walk starts from pure noise at
# Kontext's own 28-step grid and native guidance 2.5, at 512² (Kontext trained
# around 1024 — the report says whether 512 survived).
#
#   uv run --no-sync python experiments/0002_geometric_guidance/run.py --config kontext
study: kontext
name: 0002_kontext

# One seed: the owner's fast-iteration setting.
seeds: [0]

resolution: 512

backends:
  kind: real
  device: cuda
  deterministic: true
  dtype: bfloat16
  depth_dtype: float32
  segmentation_dtype: float32

sampler:
  # Kontext-dev's native operating point: the pipeline's own 28 steps and
  # BFL's editing guidance 2.5 (diffusers' 3.5 signature default is inherited
  # from FLUX.1-dev, not Kontext's).
  steps: 28
  text_guidance_scale: 2.5

guidance:
  # The pilot's clean operating point, found by sweeping eta on the native
  # 28-step grid: eta 1.0 over the first 20 steps takes depth error down
  # ~15-20% at no adherence, image-similarity or preference cost. FMRG's
  # headline eta 5.0 overdrives the sign rule here — the per-step displacement
  # scales with the step's sigma span, ~15x FMRG's 208-step grid — and carves
  # adversarial ceiling texture; 2.5 is the artifact-visible middle (runs
  # 0002_kontext_g20*, 0002_kontext_g12 under the working dir).
  eta: 1.0
  iterations: 1
  erosion_radius: 2
  resegment: true
  first_guided_step: 0
  guided_steps: 20
  max_sigma: null

# The diagnosis grid beside the primary arm: does skipping the blurry head
# (steps 0-1, where the endpoint estimate is still noise-blob on the darkest
# scene) free budget, and does a higher eta spend it — watched for the eta-2.5
# ceiling-mottling artifact class the earlier sweep found.
grid:
  - eta: 1.0
    first_guided_step: 2
    guided_steps: 20
  - eta: 2.0
    first_guided_step: 2
    guided_steps: 20
  - eta: 2.5
    first_guided_step: 4
    guided_steps: 24

adherence:
  # The eval judge, deliberately bigger than — and independent of — the
  # ViT-B/32 any CLIP guidance in this repo descends. It reads the eval text
  # against the render alone, so an arm that merely copies the photo scores
  # low on it — the confound check an image-conditioned prior needs most.
  kind: clip
  checkpoint: openai/clip-vit-large-patch14

# Render-to-photo cosine under the same independent ViT-L/14: near 1 with low
# adherence is the copying failure named, not a win.
image_similarity_checkpoint: openai/clip-vit-large-patch14

preference:
  # PickScore v1, eval only: CLIP-H fine-tuned on human choices.
  kind: pickscore

# Decoded endpoint estimate every 2nd step of the baseline and the primary
# guided arm — dense enough that the strips are centerpiece evidence, judged
# by eye; grid arms carry the numeric trace instead of frames.
endpoint_strip_every: 2

# The finished Redux run whose text-only s0u/s0g arms are quoted beside these,
# depth recomputed on its saved renders against both of this study's
# references so the column compares.
fmrg_comparison_run: 0002_fmrg_redux

# The Redux sweep's five scenes, style and eval texts verbatim; the steering
# prompt is the instruction template around the style, without any removal
# instruction — this study measures the prior and the reward, not removal.
scenes:
  - photo: scandi_living_room
    style_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    eval_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: blue_white_kitchen
    style_prompt: a modern industrial kitchen, matte black cabinetry, steel shelving, concrete worktops
    eval_prompt: a modern industrial kitchen, matte black cabinetry, steel shelving, concrete worktops
  - photo: ny_loft_bedroom
    style_prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
    eval_prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
  - photo: hotel_suite_living_room
    style_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    eval_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: lakehouse_living_room
    style_prompt: a mid-century modern living room, walnut furniture, mustard velvet sofa, brass floor lamp, warm evening light
    eval_prompt: a mid-century modern living room, walnut furniture, mustard velvet sofa, brass floor lamp, warm evening light
