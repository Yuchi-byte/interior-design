# Plumbing, not a claim: the whole benchmark flow on the weightless test doubles,
# CPU-only, offline, in seconds. Real photos off disk, real config, real
# reference, real reward, real gate — only the three checkpoints are faked.
#
#   uv run --no-sync python experiments/0002_geometric_guidance/run.py --config smoke
name: 0002_geometric_guidance_smoke

seeds: [0, 1]

# Deliberately not the benchmark's thresholds. The fake stack's energy has its
# own scale, so these numbers assert only that the two sides of the gate are
# wired up and that guidance moves both of them the right way — nothing about
# Stable Diffusion or Depth Anything.
gate:
  depth_error_margin: 0.1
  prompt_adherence_floor: 0.5

resolution: 128

backends:
  kind: fake
  device: cpu
  dtype: float32
  depth_dtype: float32
  segmentation_dtype: float32
  # The fake stack ships its own DDIM-shaped scheduler; there is nothing to swap.
  scheduler: pipeline

sampler:
  steps: 6
  noise_strength: 0.6
  text_guidance_scale: 7.5

guidance:
  # Raw-gradient units, which is what this stack's ~3e-5 energy gradient asks
  # for. `normalize: true` re-denominates the knob into latent-RMS step sizes,
  # where the equivalent of 500 here is ~0.02 and this value would blow the
  # trajectory apart — override both together.
  strength: 500.0
  schedule: constant
  erosion_radius: 2

adherence:
  # Checkpoint-free, so the smoke run never touches the network.
  kind: contents_change

scenes:
  - photo: scandi_living_room
    prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
  - photo: ny_loft_bedroom
    prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
