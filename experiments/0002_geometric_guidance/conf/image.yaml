# The image-reward question: inject the user's photo at the reward point — the
# render pulled toward the photo in a frozen vision model's feature space — and
# compare that steering against depth steering, alone and composed, across
# every plausible helper model. Per scene at one seed: an unguided control and
# the depth-only anchor under the plain style prompt (continuity anchors), the
# same pair under the renovation instruction, one image-only arm per helper
# (CLIP ViT-B/32 embedding cosine, DINOv2 patch-token cosine, the SigLIP tower
# Redux already ships, a VGG16 LPIPS-shaped perceptual distance) and an
# image+depth composite for every helper, at per-scene measured weights — the
# helper arms all steering under the instruction prompt. The photo reaches the
# prior only through the one SDEdit init every arm shares.
#
# The instruction prompt is the owner's template around each scene's style
# descriptors verbatim: "renovate this room into <style>, keep the windows,
# walls, floor and ceiling the same, remove the <object> in the room", where
# <object> is a table/desk actually present in that scene's photo (the scandi
# scene has none, so its most removable large furniture item — the shell chair
# — substitutes, and the config says so). Two readings score it: the share of
# frame still segmented as the object (photo share as baseline) and the
# common-aligned depth error over the photo's windowpane pixels. Adherence is
# still judged against the scene's one neutral style text for every arm.
#
# The known risk this study measures rather than assumes: a full-frame image
# similarity carries the old furniture as well as the shell, so it may win its
# own objective by dragging the furnishings back — which is what the adherence
# ratio, the eval image-similarity column and the per-arm visual check exist
# to expose.
#
#   uv run --no-sync python experiments/0002_geometric_guidance/run.py --config image
study: fmrg_image
name: 0002_fmrg_image

# One seed: the owner's fast-iteration setting, 12 arms x 4 scenes = 48 walks.
seeds: [0]

resolution: 512

backends:
  kind: real
  device: cuda
  deterministic: true
  dtype: bfloat16
  depth_dtype: float32
  segmentation_dtype: float32

sampler:
  # fmrg.yaml's operating point, verbatim: FMRG's `fmrgj_nfe100` grid.
  grid_steps: 208
  early_stop: 51
  unguided_steps: 1
  start_sigma: 0.9
  text_guidance_scale: 3.5
  stepping: endpoint_reuse
  differentiate_through_velocity: false

guidance:
  # Upstream's headline strength, the owner-set default — every guided arm
  # (depth, image, composite) steps at the same eta, so what separates the
  # arms is the energy alone.
  eta: 5.0
  iterations: 1
  erosion_radius: 2
  resegment: true

image:
  # The helper-model comparison: every image-only arm, and the completed grid —
  # every helper also runs an image+depth composite.
  models: [clip, dinov2, siglip, vgg]
  composite_models: [clip, dinov2, siglip, vgg]
  # null measures the depth weight per (scene, model) as the gradient-RMS
  # ratio at the midpoint of the guided window, on the walk the arms run.
  depth_weight: null
  sizing_fraction: 0.5
  # The guidance CLIP: deliberately smaller than — and split from — both eval
  # judges below.
  clip_checkpoint: openai/clip-vit-base-patch32
  dinov2_checkpoint: facebook/dinov2-base
  # The SigLIP so400m tower inside the Redux snapshot: already on disk.
  siglip_checkpoint: black-forest-labs/FLUX.1-Redux-dev
  vgg_input_size: 256

adherence:
  # The eval judge, deliberately bigger than — and independent of — every
  # feature space any arm descends.
  kind: clip
  checkpoint: openai/clip-vit-large-patch14

# Render-to-photo cosine under the same independent ViT-L/14, reported for
# every arm so the image arms' advantage on their own objective is visible but
# judged by a model none of them optimised.
image_similarity_checkpoint: openai/clip-vit-large-patch14

preference:
  # PickScore v1 (CLIP-H): the offline human-preference judge, eval only.
  kind: pickscore

# The four scenes today's studies ran, with their standing style prompts; the
# owner's "hotel_suite" maps to the assets' hotel_suite_living_room. Adherence
# judges every arm against the scene's one neutral eval text. Each removal
# object was read off the photo itself; the class ids are the ADE20K
# table/desk family (table 15, desk 33, coffee table 64) except the scandi
# scene, whose photo holds no table or desk at all — its shell chair
# substitutes, counted under the chair family (chair 19, armchair 30,
# swivel chair 75).
scenes:
  - photo: scandi_living_room
    style_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    eval_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    removal_object: chair
    removal_classes: [19, 30, 75]
    removal_substituted: true
  - photo: blue_white_kitchen
    style_prompt: a modern industrial kitchen, matte black cabinetry, steel shelving, concrete worktops
    eval_prompt: a modern industrial kitchen, matte black cabinetry, steel shelving, concrete worktops
    removal_object: table
    removal_classes: [15, 33, 64]
  - photo: ny_loft_bedroom
    style_prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
    eval_prompt: a minimalist japanese bedroom, low wooden platform bed, paper lantern, tatami
    removal_object: desk
    removal_classes: [15, 33, 64]
  - photo: hotel_suite_living_room
    style_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    eval_prompt: a scandinavian style living room, pale oak furniture, linen upholstery, soft daylight
    removal_object: coffee table
    removal_classes: [15, 33, 64]
