# The claim: a room is stripped by segmentation and inpainting, not by
# generation, and the empty room it leaves is still the same room; furnishing it
# back is then a two-energy comparison — text alone against text plus depth.
#
# Three photographs, two seeds, three arms per seed. Needs a GPU and the five
# checkpoints `roomgen-prefetch` seeds, plus the adherence CLIP below.
name: 0003_strip_and_furnish

# Listed, not drawn, so any number reported here can be reproduced exactly. The
# strip runs at the first of them.
seeds: [0, 1]

# 512 is SD1.5's training resolution and a multiple of 64; photos are
# centre-cropped square first, so no room is anamorphically squashed.
resolution: 512

backends:
  kind: real
  device: cuda
  deterministic: true
  # float16 for the UNet and VAE alone, because VRAM forces it: arm B holds the
  # decoder, the depth network and CLIP on one graph, and at float32 that peaks
  # over this 32GB card. The two judges stay at float32, so what is quantised is
  # the sampler and the image handed to them, not the energies compared over it
  # — and the reward's own reduction and the step's RMS sizing are float32 by
  # contract whatever dtype the maps arrive in.
  dtype: float16
  depth_dtype: float32
  segmentation_dtype: float32
  scheduler: ddim
  # The CLIP the guidance descends. Deliberately not the one adherence is scored
  # with below — arm A optimises this checkpoint directly, so grading it on the
  # same weights would report how well the sampler hit its own target.
  text_energy_checkpoint: openai/clip-vit-base-patch32

strip:
  # A bare room, never a renovation: stage 1 removes and does not restyle. The
  # fill must continue the shell around the hole — wall, floor, ceiling,
  # window, door — and contain nothing else.
  prompt: empty room, bare floor, bare wall, no furniture, plain interior
  # A hole this size is filled from the furnished room around it, so asking for
  # a bare room is not enough on its own: what must not appear has to be
  # refused by name, at a classifier-free scale high enough for the refusal to
  # bite — and not only furniture. The observed hallucinations (a radiator,
  # vacuum-cleaner-like objects, and later a ledge with a boxy appliance and a
  # wheeled machine that EoMT read as shell) are refused explicitly, with the
  # appliance/fixture/cart families they came from. This is the only guard the
  # whitelist acceptance below cannot provide: a fill the segmenter mislabels
  # as wall passes any label-reading check, so the shapes have to be refused at
  # generation time.
  negative_prompt: furniture, chair, table, desk, sofa, bed, radiator, heater, appliance, vent, air conditioner, fireplace, television, screen, shelf, ledge, counter, cabinet, box, machine, vacuum cleaner, cart, trolley, wheels, plant, lamp, curtain, rug, decoration, clutter, objects, people, text
  # 8px at 512. Contact shadows, segment fringes and the soft edge of a sofa all
  # sit just outside the segment, and an inpainter handed the bare segment
  # paints the furniture back from exactly that evidence. The same radius grows
  # each later pass's not-yet-shell region before it is repainted.
  dilation_radius: 8
  # Five passes at 0.85: one pass leaves a television where the sofa was (49%
  # of the cut region still segmented as furniture on the pilot), and dropping
  # the strength to 0.6 empties the room but blurs it enough that the depth
  # network re-reads the *untouched* shell 3x further from the photograph. The
  # acceptance is inverted AND whitelisted: anything in the hole not yet
  # reading as one of the five allowed fills — wall, floor, ceiling, door,
  # windowpane (`FILL_CLASSES`) — is repainted, so railing/column/stairs-shaped
  # shell is refused too, and the stricter check earns one more corrective pass
  # than the shell-wide version ran (the loop still stops early once clean;
  # `pass_residual_fractions` reports whether the budget was needed).
  passes: 5
  steps: 40
  fill_strength: 0.85
  guidance_scale: 12.0

furnish:
  steps: 50
  # High enough that the empty room is actually furnished, low enough that the
  # room is still recognisably there for an energy to hold: measured on one
  # scene, 0.6 puts a bench in an otherwise untouched room, and 0.8 furnishes a
  # different room in every arm — including the guided one, which then wins
  # 77% of a depth error that is enormous in absolute terms.
  noise_strength: 0.7
  text_guidance_scale: 7.5
  # Raw-gradient units, shared by both guided arms so arm B is arm A plus a
  # depth term rather than arm A at a different temperature. Sized against the
  # measurement below: at 40 the composite's raw step lands on the cap at the
  # sizing step and under it later, so the step still decays as the energy is
  # satisfied instead of running permanently against the ceiling.
  strength: 40.0
  clip_step_rms: 0.02
  # null measures the weight instead of guessing it: the ratio of the two terms'
  # gradient RMS on a real sample halfway through the walk.
  depth_weight: null
  sizing_fraction: 0.5
  erosion_radius: 2
  resegment: true

adherence:
  # A different CLIP from the one the text energy steers by, and the whole
  # reason this field is not left at its default.
  kind: clip
  checkpoint: openai/clip-vit-large-patch14

# Two living rooms and a bedroom, so the furnishing asked for is plausible for
# the shell it has to keep.
scenes:
  - photo: scandi_living_room
    prompt: a warm scandinavian living room, pale oak furniture, linen sofa, wool rug, soft daylight
  - photo: lakehouse_living_room
    prompt: a cosy lakehouse living room, leather armchairs, woven rug, bookshelves, warm lamplight
  - photo: ny_loft_bedroom
    prompt: a minimalist loft bedroom, low platform bed, linen bedding, paper lantern, potted plant
