[project]
name = "roomgen-guide"
version = "0.1.0"
description = "Guided diffusion sampling and the experiment harness (config/settings/eval/metrics)."
authors = [
    { name = "Yuchi-byte", email = "lyra.love.guo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "roomgen-geometry",
    "diffusers>=0.31",
    "accelerate",
    "transformers",
    "huggingface-hub>=1.0",
    # The FLUX flow-map backend's loading path: peft carries the FlowMap LoRA
    # into the transformer, sentencepiece and protobuf are T5's tokenizer.
    "peft>=0.14",
    "sentencepiece",
    "protobuf",
    "omegaconf>=2.3",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.scripts]
roomgen-prefetch = "roomgen_guide.prefetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomgen_guide"]

[tool.hatch.metadata]
allow-direct-references = true
