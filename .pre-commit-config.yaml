# Every hook here runs offline once installed: nothing resolves a model id,
# touches the Hugging Face Hub, or reaches the network at commit time.
default_install_hook_types: [pre-commit]
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown's two-space hard line break is meaningful; docs/ is prose.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
      # A stray `breakpoint()` in the guidance loop hangs a sampling run with
      # no output; ruff's T20 catches prints, this catches the debugger.
      - id: debug-statements
      # Model weights are never committed. 512kB is well above any config,
      # fixture or test asset and far below the smallest real checkpoint, so
      # this fires on exactly the mistake it is here to stop.
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.1
    hooks:
      # uv.lock is committed and CI syncs `--locked`, so a dependency edit that
      # forgets to relock fails there. Catch it at the commit that caused it.
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^packages/(roomgen-geometry|roomgen-guide)/(src|tests)/
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^packages/(roomgen-geometry|roomgen-guide)/(src|tests)/
      - id: mypy
        name: mypy
        # Whole-package check, not per-file: mypy needs both src trees on the
        # path at once to resolve roomgen_guide -> roomgen_geometry.
        entry: uv run mypy packages/roomgen-geometry/src packages/roomgen-guide/src
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        # Unfiltered locally (unlike CI): a dev machine has the Hub cache and a
        # GPU, so the `models` tests are worth paying for before a commit lands.
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
