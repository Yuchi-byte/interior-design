[tool.uv.workspace]
members = ["packages/*"]

# CPU-only PyTorch by default. uv 0.12.1 exposes `--torch-backend` on `uv pip
# install` but not on `uv sync`, so the backend is pinned declaratively instead:
# an explicit index (never consulted unless a source names it) plus per-package
# sources below. A bare `uv sync` therefore resolves the ~200MB CPU wheels, not
# the multi-GB CUDA ones, which keeps CI light.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
roomgen-geometry = { workspace = true }
roomgen-guide = { workspace = true }
# GPU users layer CUDA wheels over a synced venv in one line:
#   uv pip install --torch-backend=auto torch torchvision
# `auto` probes the local driver and picks the matching cuXXX index.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "beartype>=0.19",
    "mypy>=1.11",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "ruff>=0.15",
]

[tool.ruff]
src = ["packages/roomgen-geometry/src", "packages/roomgen-guide/src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings in annotations ("batch 3 h w", "*shape") trip ruff's
# forward-ref parser: F821 (undefined name) and F722 (syntax in forward
# annotation). They are not real errors.
"packages/roomgen-geometry/src/**" = ["F722", "F821"]
"packages/roomgen-guide/src/**" = ["F722", "F821"]

[tool.mypy]
mypy_path = ["packages/roomgen-geometry/src", "packages/roomgen-guide/src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_generics = true
disallow_any_explicit = true
warn_unreachable = true
local_partial_types = true
explicit_package_bases = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "redundant-self",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party packages that ship no py.typed, so imports from them are untyped.
# The whole pretrained-model stack (diffusers/transformers/accelerate and the
# weight + image plumbing under it) is in this bucket.
[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "diffusers.*",
    "accelerate.*",
    "torchvision.*",
    "PIL.*",
    "wandb.*",
    "safetensors.*",
    "cv2.*",
]
ignore_missing_imports = true

# The Logger protocol's log_config carries an arbitrary experiment config, so
# `dict[str, Any]` is the contract itself, not a type-gap in our code.
[[tool.mypy.overrides]]
module = ["roomgen_guide.logging", "roomgen_guide.logging.*"]
disallow_any_explicit = false

# The wandb logger wraps an untyped client: strict untyped-call/unreachable
# checks there flag wandb's own type gaps, not our bugs.
[[tool.mypy.overrides]]
module = ["roomgen_guide.logging.wandb"]
disallow_untyped_calls = false
warn_unreachable = false

[tool.pytest.ini_options]
testpaths = ["packages/roomgen-geometry/tests", "packages/roomgen-guide/tests"]
addopts = "-q"
markers = [
    "slow: long-running (many diffusion steps, full-resolution renders); excluded from quick local runs on request only, not from CI by default",
    "models: requires downloading pretrained model weights from the Hugging Face Hub; excluded from CI, which has no network or GPU",
]
