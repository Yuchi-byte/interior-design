[tool.uv.workspace]
members = ["packages/*"]
# `packages/mfm` is vendored upstream source (https://github.com/adh1s/mfm, MIT,
# see its NOTICE.md), not a member: it pins `transformers==4.50.1` against
# roomgen-geometry's `>=4.54` floor and takes `diffusers` from a git commit, and
# a workspace resolves one version of each for every member. It is built into
# its own venv from its own `requirements.txt`, so `uv.lock` never sees it.
exclude = ["packages/mfm"]

# CPU-only PyTorch by default. uv 0.12.1 exposes `--torch-backend` on `uv pip
# install` but not on `uv sync`, so the backend is pinned declaratively instead:
# an explicit index (never consulted unless a source names it) plus per-package
# sources below. A bare `uv sync` therefore resolves the ~200MB CPU wheels, not
# the multi-GB CUDA ones, which keeps CI light.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
roomgen-geometry = { workspace = true }
roomgen-guide = { workspace = true }
# GPU users layer CUDA wheels over a synced venv in one line:
#   uv pip install --torch-backend=auto torch torchvision
# `auto` probes the local driver and picks the matching cuXXX index.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "beartype>=0.19",
    "mypy>=1.11",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "ruff>=0.15",
]

[tool.ruff]
src = ["packages/roomgen-geometry/src", "packages/roomgen-guide/src"]
# Vendored upstream source (https://github.com/adh1s/mfm) is held to upstream's
# style, not ours. The gate's ruff invocations name their paths explicitly, so
# this only matters for a bare `uv run ruff check` from the repo root — which
# would otherwise report a few hundred findings nobody may fix.
extend-exclude = ["packages/mfm"]
# This root has no `[project]` table to infer a Python floor from, so the 3.12
# both packages require is stated outright: UP rewrites and the parser follow it.
target-version = "py312"
# The default, stated outright because the naming rule
# (`sum_prediction_squared`, `architectural_mask` — never `d`, `seg`) makes the
# width a live constraint: widening it even to 90 makes the formatter *join*
# deliberately split multi-term tensor expressions back onto one line.
line-length = 88

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "N",   # pep8-naming: the guidelines' naming rules, mechanised
    "UP",  # pyupgrade: keep the codebase in 3.12 idiom
    "B",   # bugbear: mutable defaults, silent-failure loops, zip(strict=)
    "A",   # shadowed builtins
    "C4",  # comprehensions
    "T20", # no print: library code reports through the Logger protocol
    "PT",  # pytest style
    "RET", # returns
    "SIM", # simplify
    "PTH", # pathlib over os.path — paths come from RoomgenSettings, never strings
    "NPY", # numpy correctness, including the 2.x removals
    "TID", # tidy imports
    "PLC", # pylint conventions
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "RUF", # ruff-specific, incl. RUF100 (a noqa that no longer suppresses anything)
]
# PLR is deliberately absent: PLR2004 (magic value) fires on every tolerance,
# pixel count and channel index in numeric code, which is noise, not a finding.
ignore = [
    # Line length is the formatter's business. E501 only ever adds a second
    # opinion about the things the formatter cannot split anyway: docstrings,
    # URLs in comments, long f-string error messages.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings in annotations ("batch 3 h w", "*shape") trip ruff's
# forward-ref parser: F821 (undefined name) and F722 (syntax in forward
# annotation). They are not real errors.
"packages/*/src/**" = ["F722", "F821"]
# Tests build fakes with the same jaxtyping annotations, and a print in a test
# is a debugging aid whose output pytest captures anyway.
"packages/*/tests/**" = ["F722", "F821", "T20"]
# Experiment entry points are scripts: printing a verdict to the terminal is
# their job.
"experiments/**" = ["F722", "F821", "T20"]

[tool.ruff.lint.isort]
# Both packages plus the shared test doubles are first-party wherever ruff is
# invoked from, including a per-file run under pre-commit where `src` inference
# has no directory context — `roomgen_fakes` lives under a tests directory, so
# nothing else would ever infer it.
known-first-party = [
    "roomgen_fakes",
    "roomgen_geometry",
    "roomgen_guide",
    "roomgen_guide_fakes",
]

[tool.ruff.lint.flake8-tidy-imports]
# `from ..depth import base` hides the package boundary that the geometry/guide
# split depends on; within-package siblings stay legal.
ban-relative-imports = "parents"

# "Strict typing IS the documentation" (docs/coding-guidelines.md), so the
# checker is what holds that claim up: every relaxation below is per-module and
# says which third-party gap forces it.
[tool.mypy]
# Both source trees on the path at once — roomgen_guide resolves
# roomgen_geometry through it — and named as `files` so a bare `uv run mypy`
# checks exactly what the gate checks. `experiments/` is the whole directory
# rather than the current framework: a new `NNNN_slug/` must not be able to
# land outside the gate the way `0002` did.
mypy_path = ["packages/roomgen-geometry/src", "packages/roomgen-guide/src"]
files = [
    "packages/roomgen-geometry/src",
    "packages/roomgen-guide/src",
    "experiments",
]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
# Beyond strict: an unparameterised `Tensor`-adjacent generic or a bare `Any`
# is precisely the documentation gap the guidelines forbid.
disallow_any_generics = true
disallow_any_explicit = true
warn_unreachable = true
local_partial_types = true
explicit_package_bases = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "redundant-self",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
    # transformers/diffusers deprecate and move API constantly; a deprecated
    # call is a future breakage, so surface it at check time.
    "deprecated",
    # A `match` over a Literal or a discriminated union that misses a case is
    # a silent fallthrough; the guidelines push both types, so close the loop.
    "exhaustive-match",
    "narrowed-type-not-subtype",
    # A `reveal_type` left in the tree is debugging residue.
    "unimported-reveal",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party packages that ship no py.typed, so imports from them are untyped.
# The whole pretrained-model stack (diffusers/transformers/accelerate and the
# weight + image plumbing under it) is in this bucket.
[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "diffusers.*",
    "accelerate.*",
    "torchvision.*",
    "PIL.*",
    "safetensors.*",
    "cv2.*",
]
ignore_missing_imports = true

# The weightless test doubles, imported by the experiment framework's `fake`
# backend stack. They live under `packages/*/tests`, which is on pytest's
# `pythonpath` but not on mypy's `files`, so mypy sees no implementation for
# them. Putting the tests trees on `mypy_path` instead would type-check the
# doubles against the pipeline Protocols, which they cannot satisfy
# structurally: `Img2ImgPipeline.scheduler` is a *mutable* attribute and
# therefore invariant, so a `FakeScheduler`-typed field is an error however
# faithful the double is. Their real check is the suite that runs them.
[[tool.mypy.overrides]]
module = ["roomgen_fakes.*", "roomgen_guide_fakes.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = [
    "packages/roomgen-geometry/tests",
    "packages/roomgen-guide/tests",
    "experiments/0002_geometric_guidance/tests",
]
# `--strict-markers` turns a misspelled marker into a collection error rather
# than a test CI silently keeps running: `-m "not models"` only protects the
# runner if the marker on a weights-hungry test is the one CI deselects.
addopts = "-q --strict-markers --strict-config"
# The weightless doubles live with the package whose Protocols they satisfy —
# `roomgen_fakes` for the depth/segmentation backends, `roomgen_guide_fakes` for
# the diffusers pipeline — and the root conftest registers both sets of
# fixtures. The geometry doubles are imported by both suites; the pipeline ones
# only by the guide suite, since the geometry package knows nothing about
# diffusion.
pythonpath = [
    "packages/roomgen-geometry/tests",
    "packages/roomgen-guide/tests",
    # `framework` is a package under the experiment directory, not an installed
    # one: its own suite imports it the same way `run.py` does.
    "experiments/0002_geometric_guidance",
]
markers = [
    "slow: long-running (many diffusion steps, full-resolution renders); excluded from quick local runs on request only, not from CI by default",
    "models: requires downloading pretrained model weights from the Hugging Face Hub; excluded from CI, which has no network or GPU",
]
