name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # One venv for the whole repo: installs both workspace members
      # (roomgen-geometry + roomgen-guide) and their declared closures. torch and
      # torchvision are pinned to the pytorch-cpu index in the root pyproject, so
      # this never pulls the multi-GB CUDA wheels onto a GPU-less runner.
      - name: Sync workspace
        run: uv sync

      - name: Ruff check
        run: uv run ruff check packages/roomgen-geometry/src packages/roomgen-geometry/tests packages/roomgen-guide/src packages/roomgen-guide/tests

      - name: Ruff format check
        run: uv run ruff format --check packages/roomgen-geometry/src packages/roomgen-geometry/tests packages/roomgen-guide/src packages/roomgen-guide/tests

      - name: Mypy (geometry + guide src)
        run: uv run mypy packages/roomgen-geometry/src packages/roomgen-guide/src

      # Anything marked `models` downloads pretrained depth/segmentation/diffusion
      # weights from the Hugging Face Hub and wants a GPU to finish in reasonable
      # time. The runner has neither, so those tests are deselected here and are
      # expected to be run locally before merge.
      - name: Pytest
        run: uv run pytest -q -m "not models"
